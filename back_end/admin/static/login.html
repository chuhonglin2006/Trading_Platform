<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>管理员登录 · 校园二手交易平台</title>
    <link rel="stylesheet" href="/admin/css/style.css">
</head>

<body class="login-body">
    <main class="login-card">
        <div class="brand-mark">校</div>
        <h1>管理员后台</h1>
        <p class="muted">校园二手交易平台 · 安全登录</p>
        <form id="login-form"><label for="username">管理员账号</label><input id="username" autocomplete="username"
                maxlength="50" required placeholder="请输入管理员账号"><label for="password">登录密码</label><input id="password"
                type="password" autocomplete="current-password" required placeholder="请输入登录密码">
            <p id="error" class="error" role="alert"></p><button id="submit" class="primary full"
                type="submit">登录后台</button>
        </form>
        <p class="footnote">仅限授权管理员访问</p>
    </main>
    <script src="/admin/js/login.js" defer></script>
</body>

</html>
